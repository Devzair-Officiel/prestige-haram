; Configuration PHP durcie pour la production.
; Copié dans /usr/local/etc/php/conf.d/ par l'image Docker de production.
; L'environnement de dev n'utilise PAS ce fichier (voir compose.yaml).

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Masque la version PHP dans les headers HTTP (X-Powered-By).
expose_php = Off

; Sessions non utilisées par l'application (endpoint stateless).
; Cookies désactivés par défaut au cas où une lib en ouvrirait par erreur.
session.use_cookies = 0
session.use_only_cookies = 1
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = "Strict"

; Limites raisonnables pour un endpoint de formulaire (payload max = 20 KB
; côté application, cf. send-quote.php).
post_max_size = 64K
upload_max_filesize = 64K
memory_limit = 64M
max_execution_time = 30
max_input_time = 20
