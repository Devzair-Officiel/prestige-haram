<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon-256.png" />
    <link rel="apple-touch-icon" href="/favicon-256.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1e3a" />

    <!-- Métadonnées par défaut (homepage). Les autres pages surchargent
         title/description/canonical dynamiquement via usePageMetadata.
         Pas de canonical statique ici : usePageMetadata injecte la
         canonique locale-aware (fr / ar-SA) au montage, ce qui évite
         que Google mémorise https://haramainprestige.com/ comme
         canonique de /ar-sa/ avant l'hydratation. -->
    <title>
      Haramain Prestige – Réservation d'hôtels à Makkah &amp; Madinah
    </title>
    <meta
      name="description"
      content="Haramain Prestige — réservation d'hôtels et accompagnement à Makkah &amp; Madinah."
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Haramain Prestige" />
    <meta property="og:locale" content="fr_FR" />
    <meta
      property="og:title"
      content="Haramain Prestige – Réservation d'hôtels à Makkah & Madinah"
    />
    <meta
      property="og:description"
      content="Haramain Prestige — réservation d'hôtels et accompagnement à Makkah & Madinah."
    />
    <meta property="og:url" content="https://haramainprestige.com/" />
    <meta
      property="og:image"
      content="https://haramainprestige.com/favicon-256.png"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Haramain Prestige – Réservation d'hôtels à Makkah & Madinah"
    />
    <meta
      name="twitter:description"
      content="Haramain Prestige — réservation d'hôtels et accompagnement à Makkah & Madinah."
    />
    <meta
      name="twitter:image"
      content="https://haramainprestige.com/favicon-256.png"
    />

    <!-- Polices auto-hébergées (@fontsource) importées via src/main.tsx :
         @font-face embarqué dans notre bundle CSS, woff2 servis depuis
         notre origine, plus de chaîne critique fonts.googleapis.com /
         fonts.gstatic.com. -->

    <!-- Preload de l'image LCP (hero) : Vite réécrit le href vers l'asset
         hashé de dist/ pendant le build. -->
    <link
      rel="preload"
      as="image"
      href="/src/assets/header-hotel-mekkah.webp"
      fetchpriority="high"
    />

    <!-- Données structurées de marque (WebSite + Organization).
         Servies dans le HTML initial pour être exploitables par les
         crawlers sans exécution JS. Ne dépend pas d'une interaction
         utilisateur. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Haramain Prestige",
        "url": "https://haramainprestige.com/",
        "inLanguage": ["fr-FR", "ar-SA"]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Haramain Prestige",
        "url": "https://haramainprestige.com/",
        "logo": "https://haramainprestige.com/favicon-256.png",
        "description": "Haramain Prestige — conciergerie de séjour à Makkah et Madinah : réservation d'hôtels à tarifs négociés et accompagnement local personnalisé.",
        "email": "contact@haramainprestige.com",
        "areaServed": [
          { "@type": "City", "name": "Makkah" },
          { "@type": "City", "name": "Madinah" },
          { "@type": "Country", "name": "Arabie saoudite" }
        ],
        "contactPoint": [
          {
            "@type": "ContactPoint",
            "contactType": "customer service",
            "email": "contact@haramainprestige.com",
            "telephone": "+33-7-73-15-79-02",
            "availableLanguage": ["fr"]
          }
        ],
        "sameAs": ["https://www.instagram.com/haramainprestige"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
