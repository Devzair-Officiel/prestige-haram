# Headers de sécurité factorisés.
# À inclure depuis chaque `location` du frontend nginx production, car
# nginx annule tous les `add_header` hérités du contexte `server` dès qu'un
# `add_header` est redéfini dans un `location` (règle d'inheritance).
# Les headers doivent donc être répétés (via include) dans chaque location
# concernée pour être effectivement présents dans la réponse.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
