# Configuration nginx pour servir dist/ en production.
# Ce serveur nginx est destiné à être derrière un reverse proxy HTTPS
# (Traefik / nginx hôte / Cloudflare / OVH). Il n'écoute qu'en HTTP:80
# à l'intérieur du réseau Docker et n'est PAS exposé directement à Internet
# depuis compose.prod.yaml — voir ce fichier.
#
# Routing SPA :
#   /                                     → sert index.html (200)
#   /a-propos                             → sert index.html (200)
#   /mentions-legales                     → sert index.html (200)
#   /politique-de-confidentialite         → sert index.html (200)
#   /hotels-makkah                        → sert index.html (200)
#   /hotels-madinah                       → sert index.html (200)
#   /ar-sa/                               → sert index.html (200)  [arabe / ar-SA]
#   /ar-sa/a-propos                       → sert index.html (200)
#   /ar-sa/mentions-legales               → sert index.html (200)
#   /ar-sa/politique-de-confidentialite   → sert index.html (200)
#   /ar-sa/hotels-makkah                  → sert index.html (200)
#   /ar-sa/hotels-madinah                 → sert index.html (200)
#   /chambre-vue-kaaba                    → sert index.html (200)
#   /ar-sa/chambre-vue-kaaba              → sert index.html (200)
#   /transfert-aeroport-jeddah-makkah     → sert index.html (200)
#   /ar-sa/transfert-aeroport-jeddah-makkah → sert index.html (200)
#   /assets/*, favicon, robots, sitemap   → sert le fichier statique (200)
#   toute autre route                     → HTTP 404 réel (nginx sert
#                                            index.html en body via error_page,
#                                            React affiche NotFound)
#
# Les `add_header` sont explicitement ré-inclus dans chaque location car
# nginx ne les hérite PAS du bloc `server` dès qu'une location contient
# son propre `add_header`. Voir docker/nginx-security-headers.conf.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;

    # Ne pas exposer la version nginx dans le header Server.
    server_tokens off;

    # Toute route inconnue ou fichier absent → statut HTTP 404 réel,
    # avec le body du SPA (React rend le composant NotFound).
    # L'internal redirect vers /index.html re-passe par le location matching
    # → matche `location = /index.html` → applique ses add_header.
    error_page 404 /index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Assets fingerprintés par Vite ---
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # --- Ressources statiques racine ---
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires 7d;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /favicon-256.png {
        access_log off;
        log_not_found off;
        expires 7d;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
        expires 1d;
        add_header Cache-Control "public" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /sitemap.xml {
        access_log off;
        expires 1d;
        add_header Cache-Control "public" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # --- index.html : jamais caché, headers de sécurité appliqués ---
    # Servi directement pour /index.html, indirectement pour les routes SPA
    # via try_files, et pour toute réponse 404 via error_page ci-dessus.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # --- Routes SPA connues → servent index.html avec statut 200 ---
    # (try_files sert le fichier dans le CONTEXTE ACTUEL sans re-matching,
    # donc les add_header doivent être présents ici aussi.)
    location = / {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    location = /a-propos {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    location = /mentions-legales {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    location = /politique-de-confidentialite {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    location = /hotels-makkah {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    location = /hotels-madinah {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    location = /chambre-vue-kaaba {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    location = /transfert-aeroport-jeddah-makkah {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    # --- Trailing slash → canonical sans slash (301) ---
    # SPA routing autorise /a-propos/ mais l'URL indexable est /a-propos.
    # On force la canonicalisation HTTP pour éviter le duplicate content.
    # `/` et `/ar-sa/` sont EXCLUS : ce sont les homepages canoniques.
    location = /a-propos/ {
        return 301 /a-propos;
    }

    location = /mentions-legales/ {
        return 301 /mentions-legales;
    }

    location = /politique-de-confidentialite/ {
        return 301 /politique-de-confidentialite;
    }

    location = /hotels-makkah/ {
        return 301 /hotels-makkah;
    }

    location = /hotels-madinah/ {
        return 301 /hotels-madinah;
    }

    location = /chambre-vue-kaaba/ {
        return 301 /chambre-vue-kaaba;
    }

    location = /transfert-aeroport-jeddah-makkah/ {
        return 301 /transfert-aeroport-jeddah-makkah;
    }

    # --- Variante arabe (préfixe /ar-sa) ---
    # `/ar-sa` sans slash final → 301 vers `/ar-sa/` (canonique unique).
    location = /ar-sa {
        return 301 /ar-sa/;
    }

    location = /ar-sa/ {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    location = /ar-sa/a-propos {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    location = /ar-sa/mentions-legales {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    location = /ar-sa/politique-de-confidentialite {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    location = /ar-sa/hotels-makkah {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    location = /ar-sa/hotels-madinah {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    location = /ar-sa/chambre-vue-kaaba {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    location = /ar-sa/transfert-aeroport-jeddah-makkah {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    # --- Google Search Console verification ---
    location = /googledcf30a5bec3f350b.html {
        access_log off;
        log_not_found off;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Trailing slash sur les pages arabes (miroir FR).
    location = /ar-sa/a-propos/ {
        return 301 /ar-sa/a-propos;
    }

    location = /ar-sa/mentions-legales/ {
        return 301 /ar-sa/mentions-legales;
    }

    location = /ar-sa/politique-de-confidentialite/ {
        return 301 /ar-sa/politique-de-confidentialite;
    }

    location = /ar-sa/hotels-makkah/ {
        return 301 /ar-sa/hotels-makkah;
    }

    location = /ar-sa/hotels-madinah/ {
        return 301 /ar-sa/hotels-madinah;
    }

    location = /ar-sa/chambre-vue-kaaba/ {
        return 301 /ar-sa/chambre-vue-kaaba;
    }

    location = /ar-sa/transfert-aeroport-jeddah-makkah/ {
        return 301 /ar-sa/transfert-aeroport-jeddah-makkah;
    }

    # --- Fallback : toute autre URI → 404 réel ---
    # Les headers sont ceux du location qui sert effectivement le body
    # (= /index.html via error_page). On les redéfinit tout de même ici
    # au cas où error_page ne serait pas appliqué (dépendance nginx interne).
    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }

    # Refuser les fichiers cachés
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
