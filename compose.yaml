services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: prestige-haram-frontend
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: npm run dev
    depends_on:
      - php

  php:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: prestige-haram-php
    ports:
      - '8081:80'
    volumes:
      - ./api/public:/var/www/html/public
      - ./api/src:/var/www/html/src
      - ./api/tests:/var/www/html/tests
    env_file:
      - ./api/.env
    restart: unless-stopped
